name: vibe-check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  issues: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BASE: https://work.nlping.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install tools
        run: |
          npm i -D playwright@1 htmlhint linkinator
          npx playwright install --with-deps

      - name: Visual check (screenshots + asserts)
        id: visual
        continue-on-error: true
        run: |
          node <<'JS'
          const fs=require('fs');
          const { chromium } = require('playwright');
          const manifest=JSON.parse(fs.readFileSync('check.manifest.json','utf8'));
          if (!fs.existsSync('screens')) fs.mkdirSync('screens');
          const base=(process.env.BASE||'').replace(/\/$/,'');
          const vp=manifest.viewport||{width:1280,height:800};
          let failed=false, log=[];
          (async ()=>{
            const browser=await chromium.launch();
            const ctx=await browser.newContext({viewport:vp});
            for (const r of manifest.routes) {
              const url=base + r.path;
              const page=await ctx.newPage();
              const res=await page.goto(url,{waitUntil:'domcontentloaded'});
              const st=res?res.status():0;
              if (!res || st>=400){ failed=true; log.push(`FAIL ${r.path}: status ${st}`); }
              for (const a of (r.asserts||[])) {
                if (a.selector){
                  const c=await page.locator(a.selector).count();
                  if (!c){ failed=true; log.push(`FAIL ${r.path}: no ${a.selector}`); } else { log.push(`OK ${r.path}: ${a.selector}`); }
                }
                if (a.text){
                  const c=await page.locator(`text=${a.text}`).first().count();
                  if (!c){ failed=true; log.push(`FAIL ${r.path}: no text "${a.text}"`); } else { log.push(`OK ${r.path}: "${a.text}"`); }
                }
              }
              const name=r.path==='/'?'_home':r.path.replace(/\//g,'_');
              await page.screenshot({path:`screens/${name}.png`,fullPage:true});
              await page.close();
            }
            await ctx.close(); await browser.close();
            fs.writeFileSync('visual.log', log.join('\n')+'\n');
            if (failed) process.exit(1);
          })();
          JS
          if [ $? -eq 0 ]; then echo "status=ok" >> $GITHUB_OUTPUT; else echo "status=fail" >> $GITHUB_OUTPUT; fi

      - name: HTMLHint
        run: npx htmlhint "**/*.html" || true

      - name: Linkinator
        run: npx linkinator "${BASE}" --config linkinator.config.json --format json > linkinator.json || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-check-artifacts
          path: |
            screens/*.png
            linkinator.json
            visual.log

      - name: Comment summary
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: vibe-check
          message: |
            База: ${{ env.BASE }}
            Visual: ${{ steps.visual.outputs.status }}
            Скрины и отчёты см. в артефакте **vibe-check-artifacts**.

      - name: Evaluate gates
        run: |
          [ "${{ steps.visual.outputs.status }}" = "ok" ]
