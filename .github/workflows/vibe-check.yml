name: vibe-check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  issues: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BASE: https://work.nlping.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install tools
        run: |
          npm i -D playwright@1 htmlhint
          npx playwright install --with-deps

      - name: Visual check (screenshots + asserts)
        id: visual
        continue-on-error: true
        run: |
          node <<'JS'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const manifest = JSON.parse(fs.readFileSync('check.manifest.json','utf8'));
          if (!fs.existsSync('screens')) fs.mkdirSync('screens');
          const base = (process.env.BASE||'').replace(/\/$/,'');
          const vp = manifest.viewport || {width:1280,height:800};
          let failed=false, assetFails=0, linkFails=0, log=[];
          const assetEntries=[];
          const linkEntries=[];
          (async ()=>{
            const browser = await chromium.launch();
            const ctx = await browser.newContext({ viewport: vp });
            for (const r of manifest.routes) {
              const url = base + r.path;
              const page = await ctx.newPage();
              // собираем неуспешные запросы ассетов
              page.on('response', resp=>{
                const ct = resp.headers()['content-type']||'';
                const isAsset = /(text\/css|javascript|image|font)/i.test(ct);
                if (isAsset && resp.status()>=400) {
                  assetFails++;
                  const entry = `ASSET ${resp.status()} ${resp.url()}`;
                  assetEntries.push(entry);
                  log.push(entry);
                }
              });
              const res = await page.goto(url, { waitUntil:'domcontentloaded' });
              const st = res ? res.status() : 0;
              if (!res || st>=400){ failed=true; log.push(`FAIL ${r.path}: status ${st}`); }
              // мягкие ассёрты
              for (const a of (r.asserts||[])) {
                if (a.selector){
                  const c = await page.locator(a.selector).count();
                  if (!c){ failed=true; log.push(`FAIL ${r.path}: no ${a.selector}`); } else { log.push(`OK ${r.path}: ${a.selector}`); }
                }
                if (a.text){
                  const c = await page.locator(`text=${a.text}`).first().count();
                  if (!c){ failed=true; log.push(`FAIL ${r.path}: no text "${a.text}"`); } else { log.push(`OK ${r.path}: "${a.text}"`); }
                }
              }
              // shallow-links (только свой домен)
              const anchors = await page.$$eval('a[href]', as => as.map(a=>a.href));
              const own = anchors.filter(h=>h && h.startsWith(location.origin));
              for (const h of own) {
                try {
                  const r = await page.request.fetch(h, { method:'GET' });
                  if (r.status()>=400){
                    linkFails++;
                    const entry = `LINK ${r.status()} ${h}`;
                    linkEntries.push(entry);
                    log.push(entry);
                  }
                } catch {
                  linkFails++;
                  const entry = `LINK ERR ${h}`;
                  linkEntries.push(entry);
                  log.push(entry);
                }
              }
              const name = r.path==='/' ? '_home' : r.path.replace(/\//g,'_');
              await page.screenshot({ path:`screens/${name}.png`, fullPage:true });
              await page.close();
            }
            await ctx.close(); await browser.close();
            const status = failed ? 'fail' : 'ok';
            fs.writeFileSync('visual.status', status);
            fs.writeFileSync('assets.count', String(assetFails));
            fs.writeFileSync('links.count', String(linkFails));
            fs.writeFileSync('visual.log', log.join('\n')+'\n');
            fs.writeFileSync('assets.log', assetEntries.length ? assetEntries.join('\n')+'\n' : 'OK\n');
            fs.writeFileSync('links.log', linkEntries.length ? linkEntries.join('\n')+'\n' : 'OK\n');
            const summary = {
              status,
              assetFailures: assetFails,
              linkFailures: linkFails,
              assetSamples: assetEntries.slice(0,3),
              linkSamples: linkEntries.slice(0,3)
            };
            fs.writeFileSync('visual-summary.json', JSON.stringify(summary,null,2));
            process.exit(failed ? 1 : 0);
          })();
          JS
          echo "status=$(cat visual.status)" >> "$GITHUB_OUTPUT"
          echo "assets=$(cat assets.count)" >> "$GITHUB_OUTPUT"
          echo "links=$(cat links.count)" >> "$GITHUB_OUTPUT"

      - name: HTMLHint
        run: npx htmlhint "**/*.html" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-check-artifacts
          path: |
            screens/*.png
            visual.log
            assets.log
            links.log
            visual-summary.json

      - name: Comment summary
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: vibe-check
          message: |
            База: ${{ env.BASE }}
            Visual: ${{ steps.visual.outputs.status }}
            Assets: ${{ steps.visual.outputs.assets }} fails
            Links: ${{ steps.visual.outputs.links }} broken (шаллоу)
            Скрины/логи — в артефакте **vibe-check-artifacts**.

      # мягкий гейт: блокируем PR только если visual не ок
      - name: Evaluate gates
        run: |
          test "${{ steps.visual.outputs.status }}" = "ok"
